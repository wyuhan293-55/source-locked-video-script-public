display_name: Source-Locked Video Script
short_description: Turn timestamped raw footage into decision-driven, source-locked, edit-ready short-video scripts.
default_prompt: "Use this skill to analyze my full timestamped source material first, identify the most worthwhile content threads and one clear viewing/decision task per piece, then wait for one selection before generating the source-locked final script with fine-grained time frames. Keep source wording traceable, allow deletion but no invented additions, and apply channel-specific compliance when needed."
